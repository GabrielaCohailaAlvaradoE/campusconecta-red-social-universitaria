name: CI y despliegue de CampusConecta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: codigo_fuente/frontend/package-lock.json

      - name: Ejecutar pruebas del backend
        run: dotnet test codigo_fuente/backend/CampusConecta.Tests/CampusConecta.Tests.csproj --configuration Release

      - name: Instalar, analizar y compilar frontend
        working-directory: codigo_fuente/frontend
        run: |
          npm ci
          npm run lint
          VITE_API_URL='' npm run build

      - name: Integrar frontend estático en la API
        run: |
          mkdir -p codigo_fuente/backend/CampusConecta.Api/wwwroot
          cp -R codigo_fuente/frontend/dist/. codigo_fuente/backend/CampusConecta.Api/wwwroot/

      - name: Publicar aplicación ASP.NET Core
        run: dotnet publish codigo_fuente/backend/CampusConecta.Api/CampusConecta.Api.csproj --configuration Release --output codigo_fuente/.publish/campusconecta

      - name: Empaquetar publicación
        working-directory: codigo_fuente/.publish/campusconecta
        run: zip -r ../campusconecta.zip .

      - name: Iniciar sesión en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Desplegar en Azure App Service
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp deploy \
              --resource-group rg-campusconecta-student \
              --name campusconecta-upt-20261004 \
              --src-path "$GITHUB_WORKSPACE/codigo_fuente/.publish/campusconecta.zip" \
              --type zip \
              --async false \
              --track-status true
