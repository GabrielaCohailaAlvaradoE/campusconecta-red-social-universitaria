name: CI y despliegue de CampusConecta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: codigo_fuente/frontend/package-lock.json

      - name: Ejecutar pruebas del backend
        run: dotnet test codigo_fuente/backend/CampusConecta.Tests/CampusConecta.Tests.csproj --configuration Release

      - name: Instalar, analizar y compilar frontend
        working-directory: codigo_fuente/frontend
        run: |
          npm ci
          npm run lint
          VITE_STATIC_DEMO=true npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Cargar sitio estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: codigo_fuente/frontend/dist

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
